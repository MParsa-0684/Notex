<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 580" role="img" aria-labelledby="title desc">
<title id="title">Notex — Space for thought</title><desc id="desc">Illustrated writing page and connected whiteboard in the Notex palette. Product artwork, not a screenshot.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081a2e"/><stop offset="1" stop-color="#0d47a1"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#90caf9" opacity=".18"/></pattern></defs>
<rect width="1440" height="580" rx="28" fill="url(#bg)"/><rect width="1440" height="580" rx="28" fill="url(#dots)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="85" y="126" font-size="15" letter-spacing="4" fill="#90caf9">YOUR WORDS. YOUR IDEAS. YOUR SPACE.</text>
<text x="78" y="252" font-size="110" font-weight="700" fill="#e3f2fd">Notex</text><text x="85" y="310" font-size="34" fill="#90caf9">Space for thought.</text>
<text x="85" y="367" font-size="20" fill="#e3f2fd">A page to write. A canvas to explore.</text><text x="85" y="400" font-size="20" fill="#e3f2fd">An idea worth keeping.</text>
<rect x="85" y="461" width="390" height="44" rx="22" fill="#90caf9" fill-opacity=".12" stroke="#90caf9" stroke-opacity=".4"/><text x="112" y="489" font-size="14" letter-spacing="2" fill="#e3f2fd">WRITE · SKETCH · CONNECT · PROTECT</text>
<g transform="translate(716 94) rotate(-5 160 180)"><rect width="334" height="393" rx="20" fill="#e3f2fd"/><rect width="334" height="49" rx="20" fill="#90caf9"/><text x="25" y="32" font-size="14" font-weight="700" fill="#0d47a1">THE NOTEBOOK</text><text x="28" y="102" font-size="23" font-weight="700" fill="#0d47a1">It starts with a thought.</text><path d="M28 131H280M28 153H251M28 175H272" stroke="#90caf9" stroke-width="8" stroke-linecap="round"/><text x="290" y="233" text-anchor="end" font-size="25" fill="#0d47a1">جایی برای ایده‌های تازه</text><path d="M28 282h18v18H28zm0 43h18v18H28z" fill="none" stroke="#2196f3" stroke-width="2"/><path d="M65 290H273M65 335H230" stroke="#90caf9" stroke-width="8" stroke-linecap="round"/></g>
<g transform="translate(1050 234) rotate(7)"><rect width="289" height="235" rx="20" fill="#0e243c" stroke="#90caf9" stroke-width="2"/><text x="25" y="36" font-size="13" letter-spacing="2" fill="#90caf9">LET IT CONNECT</text><path d="M75 105Q156 53 213 121M75 105Q81 186 176 179" fill="none" stroke="#2196f3" stroke-width="4"/><circle cx="75" cy="105" r="23" fill="#90caf9"/><circle cx="213" cy="121" r="18" fill="#2196f3"/><circle cx="176" cy="179" r="14" fill="#e3f2fd"/></g></g></svg>
